group = org.zeroj
version = 0.1.0-pre13-SNAPSHOT

# JuLC (org.julclang) for zeroj-onchain-julc and zeroj-integration-tests: the Gradle plugin and every
# julc-* dependency. Override with -PjulcVersion=<v> to try another JuLC. A change here also needs a
# deliberate COMPILER_PROFILE bump (ADR-0050 I8); CompilerProfileTest fails until it is made.
julcVersion = 0.1.0-pre18
# Release side effects of a v* tag, independent of the Maven Central deployment.
# The Central deployment is staged and still needs a human to publish it; a GitHub
# release is deletable but still notifies watchers and advertises the tag as a real
# release. With this false a tag builds, runs the full suite, builds the ceremony CLI
# on four platforms and stages a Central deployment, and publishes nothing (as long as
# bloxbean_repo_publish below is false too) — so a release can be rehearsed end to end.
github_release = true

# Where a v* tag publishes the Maven artifacts (release-ops docs/12-bloxbean-maven-repository.md). Both are built and
# signed once, so with both true the same files go to both. A Central deployment is staged and still needs a human to
# publish it; the BloxBean repository (https://repo.bloxbean.org/maven/releases) is public, and permanent, the moment
# the release run uploads it. Turn Central off to release to the BloxBean repository only (e.g. Central's quota is
# exhausted).
maven_central_publish = true
bloxbean_repo_publish = true
