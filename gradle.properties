group = org.zeroj
version = 0.1.0-pre12-dev1
# Release side effects of a v* tag, independent of the Maven Central deployment.
# The Central deployment is staged and still needs a human to publish it; a GitHub
# release is deletable but still notifies watchers and advertises the tag as a real
# release. With this false a tag builds, runs the full suite, builds the ceremony CLI
# on four platforms and stages a Central deployment, and publishes nothing — so a
# release can be rehearsed end to end.
github_release = false
