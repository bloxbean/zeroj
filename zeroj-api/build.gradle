plugins {
    id 'java-library'
}

description = 'ZeroJ core proof model, envelopes, and verification result types'

dependencies {
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'com.networknt:json-schema-validator:2.0.0'
}

// commitment-profiles-v1 §12.1: no class from another jar may join the commitment contract package
// (for example to reach the package-private CommitmentCheck factory).
tasks.named('jar') {
    manifest {
        attributes(['Sealed': 'true'], 'org/zeroj/api/commitment/')
    }
}

test {
    systemProperty 'zeroj.manifest.schema',
            rootProject.file('docs/merkle/circuit-manifest-v1.schema.json').absolutePath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'ZeroJ API'
                description = 'Core ZK proof model and verification types'
            }
        }
    }
}
