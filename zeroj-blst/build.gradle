plugins {
    id 'java-library'
}

description = 'ZeroJ BLS12-381 operations via blst native library (JNI/SWIG)'

dependencies {
    api project(':zeroj-api')
    api project(':zeroj-bls12381')
    api 'foundation.icon:blst-java:0.3.2'

    // ADR-0060 M3: the commitment-profiles-v1 §13 G1 vectors, run through the blst provider by the
    // shared runner in zeroj-bls12381's test fixtures (test classpath only, never published).
    testImplementation testFixtures(project(':zeroj-bls12381'))
    testImplementation project(':zeroj-test-vectors')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

// ADR-0061 M3: the Bulletproof range-proof benchmark (zeroj-bls12381 test fixture) on the blst provider.
// Records only. Run: ./gradlew :zeroj-blst:bulletproofBenchmarkBlst
tasks.register('bulletproofBenchmarkBlst', JavaExec) {
    group = 'verification'
    description = 'ADR-0061: Bulletproof range-proof host benchmark, blst provider (records only).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.zeroj.bls12381.bulletproofs.BulletproofBenchmark'
    args '--provider', 'blst'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'ZeroJ BLST'
                description = 'BLS12-381 cryptographic operations via blst'
            }
        }
    }
}
