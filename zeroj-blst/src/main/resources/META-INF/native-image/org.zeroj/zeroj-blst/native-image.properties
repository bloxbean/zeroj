# ADR-0029 M9 / ADR-0062 M8 — GraalVM native-image config for the FFM blst binding.
#
# reachability-metadata.json registers every FFM downcall shape the binding uses (BlstCurve,
# BlstG1Msm, BlstG2Msm; GraalVM 25 needs each FunctionDescriptor registered at build time) and
# embeds the bundled libblst binaries plus their SHA-256 manifest, which BlstFfm extracts and
# verifies at run time. A new downcall shape must be added there, or the image fails at run time
# with MissingForeignRegistrationError.
#
# Verified 2026-10-28 with Oracle GraalVM 25.0.2 on macOS aarch64: a consumer image exercising the
# provider (scalar mul, secret path, pairing) and the G1 MSM runs and matches pure Java.
Args = --enable-native-access=ALL-UNNAMED
