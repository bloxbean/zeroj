plugins {
    id 'java-library'
}

description = 'ZeroJ Poseidon-rooted Merkle Patricia Forestry integration for CCL'

dependencies {
    api project(':zeroj-circuit-lib')
    api project(':zeroj-circuit-annotation-api')
    api "com.bloxbean.cardano:cardano-client-merkle-patricia-forestry:${rootProject.ext.cclVersion}"
    api "com.bloxbean.cardano:cardano-client-verified-structures-core:${rootProject.ext.cclVersion}"

    implementation 'co.nstant.in:cbor:0.9'
    testImplementation project(':zeroj-test-vectors')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'ZeroJ MPF Poseidon'
                description = 'Poseidon-rooted CCL Merkle Patricia Forestry helpers for ZeroJ circuits'
            }
        }
    }
}
