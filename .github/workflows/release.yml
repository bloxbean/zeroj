name: Release

# ADR-0044: releases publish the default product surface only. The gnark (Go) and Halo2 (Rust)
# runtime providers were removed, so the release no longer builds or bundles their native
# libraries. libblst is still built from source per release for zeroj-blst.

on:
  push:
    tags:
      - 'v*'
  # Preview mode: builds the ceremony CLI distributables as workflow ARTIFACTS
  # (no Maven publish, no release assets) — dry-run the release without a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ================================================================
  # Stage 1: Build libblst from source for every supported platform
  # (pinned tag in zeroj-blst/scripts/build-blst.sh) so released jars
  # never ship stale/unverified blst binaries.
  # ================================================================

  build-blst-native:
    name: blst native (${{ matrix.os }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: macos-14
            os: mac
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build libblst from source
        run: zeroj-blst/scripts/build-blst.sh
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: blst-native-${{ matrix.os }}-${{ matrix.arch }}
          path: zeroj-blst/src/main/resources/native/${{ matrix.os }}/${{ matrix.arch }}/libblst.*
          retention-days: 1

  # ================================================================
  # Stage 2: Build JARs with the blst natives bundled and publish
  # ================================================================

  publish:
    name: Publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build-blst-native ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for grgit version

      - name: Set up Java 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Download blst natives
        uses: actions/download-artifact@v4
        with:
          pattern: blst-native-*
          merge-multiple: false

      - name: Place native libraries in resource directories
        run: |
          # blst (source-built, replaces the committed dev binaries in the released jars)
          for target in linux/amd64 linux/aarch64 mac/aarch64; do
            os=${target%/*}; arch=${target#*/}
            mkdir -p zeroj-blst/src/main/resources/native/$target
            cp blst-native-$os-$arch/* zeroj-blst/src/main/resources/native/$target/ || true
          done

          echo "=== blst native libraries ==="
          find zeroj-blst/src/main/resources/native -type f

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Assert the default graph has no assurance/benchmark/removed-provider edge
        run: ./gradlew verifyDefaultModuleSurface --stacktrace

      - name: Decode GPG Key
        run: |
          mkdir -p ~/.gradle/
          echo "${{ secrets.SIGNING_KEY }}" > ~/.gradle/secring.gpg.b64
          base64 -d ~/.gradle/secring.gpg.b64 > ~/.gradle/secring.gpg

      - name: Publish to Maven Central
        run: ./gradlew publishToSonatype closeSonatypeStagingRepository -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} -Psigning.password=${{ secrets.SIGNING_PASSWORD }} -Psigning.secretKeyRingFile=$(echo ~/.gradle/secring.gpg) --warn --stacktrace
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}

  # ================================================================
  # Stage 3: Ceremony CLI distributables -> GitHub release assets
  # (ADR-0031: contributors download one artifact and run the ceremony)
  # ADR-0044: the CLI now ships from zeroj-tools. The command name, CLI
  # behavior and every release asset name are unchanged.
  # ================================================================

  ceremony-cli-release:
    name: ceremony CLI (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # attach assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux-x86_64
            ext: ''
            fatjar: true          # the (platform-independent) fat jar is uploaded once, from linux
          - runner: ubuntu-24.04-arm
            os: linux-arm64
            ext: ''
            fatjar: false
          - runner: macos-14
            os: macos-arm64
            ext: ''
            fatjar: false
          - runner: windows-latest
            os: windows-x86_64
            ext: '.exe'
            fatjar: false
          # windows-arm64: GraalVM ships no windows-aarch64 native-image toolchain yet —
          # ARM Windows users run the x86_64 binary (emulation) or the fat jar.
          # macos-x86_64 (Intel): GitHub retired the free Intel runner (macos-13) Dec 2025 and
          # macOS = arm64-only across this project — Intel Mac users run the fat jar.
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          native-image-job-reports: 'true'

      - name: Build native zip distribution (fatJar -> native-image -> zip)
        shell: bash
        run: |
          ./gradlew :zeroj-tools:nativeDistZip -Pplatform=${{ matrix.os }} --no-daemon
          zeroj-tools/build/native/zeroj-ceremony${{ matrix.ext }} --version

      # tag push -> attach to the GitHub release
      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.fatjar == true && 'zeroj-tools/build/libs/zeroj-ceremony-*-all.jar' || '' }}
            zeroj-tools/build/distributions/zeroj-ceremony-*-${{ matrix.os }}.zip

      # manual dispatch (preview) -> workflow artifacts only
      - name: Upload preview artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ceremony-cli-preview-${{ matrix.os }}
          path: |
            ${{ matrix.fatjar == true && 'zeroj-tools/build/libs/zeroj-ceremony-*-all.jar' || '' }}
            zeroj-tools/build/distributions/zeroj-ceremony-*-${{ matrix.os }}.zip
