name: Release

# ADR-0044: releases publish the default product surface only. The gnark (Go) and Halo2 (Rust)
# runtime providers were removed, so the release no longer builds or bundles their native
# libraries. libblst is still built from source per release for zeroj-blst.
#
# ADR-0048: a tag STAGES a Maven Central deployment and publishes nothing. The upload is
# USER_MANAGED — it stops once Sonatype has validated the bundle, and a human releases it through
# the approval-gated publish-central.yml or the portal UI. The GitHub release is gated on
# `github_release` in gradle.properties (default false), so a tag can rehearse the whole pipeline —
# full test suite, four-platform ceremony CLI, signed Central bundle — without any public side
# effect.

on:
  push:
    tags:
      - 'v*'
  # Preview mode: builds the ceremony CLI distributables as workflow ARTIFACTS
  # (no Maven publish, no release assets) — dry-run the release without a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ================================================================
  # Stage 0: Read the release gates out of gradle.properties
  # ================================================================

  validate:
    name: Release gates
    runs-on: ubuntu-latest
    outputs:
      github_release: ${{ steps.gates.outputs.github_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # grgit reads the checked-out commit

      - name: Set up Java 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read the release gates
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          # A GitHub release is deletable, unlike a published Maven Central version, but it still
          # notifies watchers and advertises the tag as a real release. Gating it lets a tag
          # rehearse the whole pipeline and stage Maven Central only. Missing property -> false.
          GITHUB_RELEASE=$(./gradlew -q properties | awk '/^github_release:/ { print $2; exit }')
          echo "github_release=${GITHUB_RELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "GitHub release for this tag: ${GITHUB_RELEASE:-false}"

  # ================================================================
  # Stage 1: Build libblst from source for every supported platform
  # (pinned tag in zeroj-blst/scripts/build-blst.sh) so released jars
  # never ship stale/unverified blst binaries.
  # ================================================================

  build-blst-native:
    name: blst native (${{ matrix.os }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: macos-14
            os: mac
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build libblst from source
        run: zeroj-blst/scripts/build-blst.sh
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: blst-native-${{ matrix.os }}-${{ matrix.arch }}
          path: zeroj-blst/src/main/resources/native/${{ matrix.os }}/${{ matrix.arch }}/libblst.*
          retention-days: 1

  # ================================================================
  # Stage 2: Build JARs with the blst natives bundled and stage the
  # signed Central Portal deployment (nothing is published here)
  # ================================================================

  publish:
    name: Stage Maven Central deployment
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build-blst-native ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for grgit version

      - name: Set up Java 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Download blst natives
        uses: actions/download-artifact@v4
        with:
          pattern: blst-native-*
          merge-multiple: false

      - name: Place native libraries in resource directories
        run: |
          # blst (source-built, replaces the committed dev binaries in the released jars)
          for target in linux/amd64 linux/aarch64 mac/aarch64; do
            os=${target%/*}; arch=${target#*/}
            mkdir -p zeroj-blst/src/main/resources/native/$target
            cp blst-native-$os-$arch/* zeroj-blst/src/main/resources/native/$target/ || true
          done

          echo "=== blst native libraries ==="
          find zeroj-blst/src/main/resources/native -type f

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Assert the default graph has no assurance/benchmark/removed-provider edge
        run: ./gradlew verifyDefaultModuleSurface --stacktrace

      - name: Decode GPG Key
        run: |
          mkdir -p ~/.gradle/
          echo "${{ secrets.SIGNING_KEY }}" > ~/.gradle/secring.gpg.b64
          base64 -d ~/.gradle/secring.gpg.b64 > ~/.gradle/secring.gpg

      # Uploads a USER_MANAGED deployment and waits for Sonatype validation. It stops there:
      # nothing is on Maven Central until a human publishes it, via publish-central.yml or the
      # portal. See nmcpAggregation in build.gradle.
      - name: Upload deployment to Maven Central staging
        id: upload
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not add --warn here. It lowers Gradle below LIFECYCLE, which is the level nmcp
          # reports the deployment id at, and the grep below would then fail every release after
          # a successful upload.
          ./gradlew publishAggregationToCentralPortal \
            -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} \
            -Psigning.password=${{ secrets.SIGNING_PASSWORD }} \
            -Psigning.secretKeyRingFile=$HOME/.gradle/secring.gpg \
            --stacktrace 2>&1 | tee upload.log
          # The deployment id exists only in nmcp's output. Fail loudly if the log format changes
          # rather than reporting a release with no id.
          id=$(grep -oE "deployment bundle '[0-9a-f-]{36}'" upload.log \
            | head -1 | grep -oE '[0-9a-f-]{36}' || true)
          if [[ -z "$id" ]]; then
            echo "::error::Upload succeeded but no deployment id was found in the log." >&2
            exit 1
          fi
          echo "deployment-id=$id" >> "$GITHUB_OUTPUT"

      - name: Record the pending deployment
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment-id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Maven Central deployment staged — NOT published"
            echo
            echo "Deployment \`$DEPLOYMENT_ID\` (\`zeroj:${GITHUB_REF_NAME#v}\`) passed validation"
            echo "and is waiting for a human."
            echo
            echo "Publish it through the approval-gated workflow:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/publish-central.yml"
            echo
            echo "Or from the portal: https://central.sonatype.com/publishing/deployments"
            echo
            echo "Nothing is on Maven Central until that happens."
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # Stage 3: Ceremony CLI distributables -> GitHub release assets
  # (ADR-0031: contributors download one artifact and run the ceremony)
  # ADR-0044: the CLI now ships from zeroj-tools. The command name, CLI
  # behavior and every release asset name are unchanged.
  # ================================================================

  ceremony-cli-release:
    name: ceremony CLI (${{ matrix.os }})
    needs: [ validate ]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # attach assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux-x86_64
            ext: ''
            fatjar: true          # the (platform-independent) fat jar is uploaded once, from linux
          - runner: ubuntu-24.04-arm
            os: linux-arm64
            ext: ''
            fatjar: false
          - runner: macos-14
            os: macos-arm64
            ext: ''
            fatjar: false
          - runner: windows-latest
            os: windows-x86_64
            ext: '.exe'
            fatjar: false
          # windows-arm64: GraalVM ships no windows-aarch64 native-image toolchain yet —
          # ARM Windows users run the x86_64 binary (emulation) or the fat jar.
          # macos-x86_64 (Intel): GitHub retired the free Intel runner (macos-13) Dec 2025 and
          # macOS = arm64-only across this project — Intel Mac users run the fat jar.
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          native-image-job-reports: 'true'

      - name: Build native zip distribution (fatJar -> native-image -> zip)
        shell: bash
        run: |
          ./gradlew :zeroj-tools:nativeDistZip -Pplatform=${{ matrix.os }} --no-daemon
          zeroj-tools/build/native/zeroj-ceremony${{ matrix.ext }} --version

      # tag push, with github_release opted in -> attach to the GitHub release.
      # ADR-0048: a GitHub release is deletable but still notifies watchers and advertises the tag
      # as a real release, so it is off unless gradle.properties says otherwise. The distributions
      # are still built on every platform and kept as workflow artifacts below, so a rehearsal tag
      # exercises the same build and the binaries remain available for inspection.
      - name: Upload to GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && needs.validate.outputs.github_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.fatjar == true && 'zeroj-tools/build/libs/zeroj-ceremony-*-all.jar' || '' }}
            zeroj-tools/build/distributions/zeroj-ceremony-*-${{ matrix.os }}.zip

      # manual dispatch (preview), or a tag with the GitHub release gated off
      # -> workflow artifacts only
      - name: Upload preview artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') || needs.validate.outputs.github_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ceremony-cli-preview-${{ matrix.os }}
          path: |
            ${{ matrix.fatjar == true && 'zeroj-tools/build/libs/zeroj-ceremony-*-all.jar' || '' }}
            zeroj-tools/build/distributions/zeroj-ceremony-*-${{ matrix.os }}.zip
