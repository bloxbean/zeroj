name: Release

# From the release-ops standard (templates/workflows/release.yml, 2026-10-04, with the BloxBean Maven repository),
# adapted for ZeroJ: libblst is built from source for every platform and bundled into zeroj-blst, and the ceremony
# CLI (zeroj-tools) ships as native GitHub release assets.
#
# ADR-0044: releases publish the default product surface only. The gnark (Go) and Halo2 (Rust) runtime
# providers were removed, so the release no longer builds or bundles their native libraries.
#
# ADR-0048: a v* tag, created by tag-release.yml after a code-owner-approved version bump merges and a release
# owner approves, builds and signs every module once and publishes the Maven artifacts where gradle.properties
# says (release-ops docs/12-bloxbean-maven-repository.md):
#   maven_central_publish  uploads a USER_MANAGED Central Portal deployment. It stops there: nothing is on Maven
#                          Central until a human publishes the deployment, via publish-central.yml or the portal.
#   bloxbean_repo_publish  publishes to https://repo.bloxbean.org/maven/releases, public and permanent at once.
# With both on, both receive the same signed files: one Gradle run builds the staged repository and the Central
# bundle, which are checked byte for byte, and the Central upload reuses that bundle. The BloxBean repository goes
# first, so a Central failure (e.g. its quota) leaves the release there.
#
# The GitHub release is a separate job, gated on `github_release` in gradle.properties (default false). With it
# and bloxbean_repo_publish off, a tag rehearses the whole pipeline (full test suite, four-platform ceremony CLI,
# signed Central bundle) without any public side effect. It is the only job with a write token, and it never sees
# the release secrets.

on:
  push:
    tags:
      - 'v*'
  # Preview mode: builds the ceremony CLI distributables as workflow artifacts only (no Central upload, no
  # GitHub release), to dry-run the CLI build without a tag.
  workflow_dispatch:

permissions: {}

# Never cancel a run that may already have uploaded a deployment.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ================================================================
  # Stage 0: Validate the tag and read the release gates
  # ================================================================

  validate:
    name: Release gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_final: ${{ steps.version.outputs.is_final }}
      github_release: ${{ steps.version.outputs.github_release }}
      maven_central_publish: ${{ steps.version.outputs.maven_central_publish }}
      bloxbean_repo_publish: ${{ steps.version.outputs.bloxbean_repo_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # grgit reads the checked-out commit
          persist-credentials: false

      - name: Set up Java 25 (GraalVM)
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Validate tag and read release flags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # gradle.properties uses `key = value`; reading it through Gradle tolerates the spaces.
          PROPS=$(./gradlew -q properties)
          VERSION=$(awk '/^version:/ { print $2; exit }' <<< "$PROPS")
          # A GitHub release is deletable, unlike a Central version, but it still notifies watchers and
          # advertises the tag as a real release. Gating it lets a tag rehearse the whole pipeline and
          # stage Maven Central only. Missing property -> false.
          GITHUB_RELEASE=$(awk '/^github_release:/ { print $2; exit }' <<< "$PROPS")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
              echo "::error::Git tag ${GITHUB_REF_NAME} does not match Gradle version ${VERSION}" >&2
              exit 1
            fi
            if [[ "$VERSION" == *SNAPSHOT* ]]; then
              echo "::error::Release tags require a non-SNAPSHOT version. Got: $VERSION" >&2
              exit 1
            fi
          else
            echo "::notice::Preview run on ${GITHUB_REF_NAME}: ceremony CLI artifacts only."
            GITHUB_RELEASE=false
          fi
          IS_FINAL=false
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_FINAL=true
          fi
          # Where the Maven artifacts go must be stated, not defaulted: a missing line is an error.
          MAVEN_CENTRAL_PUBLISH=$(awk '/^maven_central_publish:/ { print $2; exit }' <<< "$PROPS")
          BLOXBEAN_REPO_PUBLISH=$(awk '/^bloxbean_repo_publish:/ { print $2; exit }' <<< "$PROPS")
          for flag in "maven_central_publish=$MAVEN_CENTRAL_PUBLISH" "bloxbean_repo_publish=$BLOXBEAN_REPO_PUBLISH"; do
            if [[ "${flag#*=}" != true && "${flag#*=}" != false ]]; then
              echo "::error::gradle.properties must set ${flag%%=*} to true or false." >&2
              exit 1
            fi
          done
          {
            echo "version=$VERSION"
            echo "is_final=$IS_FINAL"
            echo "github_release=${GITHUB_RELEASE:-false}"
            echo "maven_central_publish=$MAVEN_CENTRAL_PUBLISH"
            echo "bloxbean_repo_publish=$BLOXBEAN_REPO_PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (final: $IS_FINAL), Maven Central: $MAVEN_CENTRAL_PUBLISH," \
            "BloxBean repository: $BLOXBEAN_REPO_PUBLISH, GitHub release: ${GITHUB_RELEASE:-false}"

  # ================================================================
  # Stage 1: Build libblst from source for every supported platform
  # (pinned tag in zeroj-blst/scripts/build-blst.sh) so released jars
  # never ship stale/unverified blst binaries.
  # ================================================================

  build-blst-native:
    name: blst native (${{ matrix.os }}/${{ matrix.arch }})
    needs: [ validate ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: macos-14
            os: mac
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build libblst from source
        run: zeroj-blst/scripts/build-blst.sh
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: blst-native-${{ matrix.os }}-${{ matrix.arch }}
          path: zeroj-blst/src/main/resources/native/${{ matrix.os }}/${{ matrix.arch }}/libblst.*
          retention-days: 1

  # ================================================================
  # Stage 2: Build JARs with the blst natives bundled, sign them once
  # and publish them where gradle.properties says: the BloxBean Maven
  # repository and/or a staged Central Portal deployment
  # ================================================================

  publish:
    name: Publish Maven artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ validate, build-blst-native ]
    runs-on: ubuntu-24.04
    # The signing subkey, Central Portal token and bucket credentials are secrets of this environment, which only
    # accepts v* tags (plus the default branch and release/** for the other release workflows). Only the release
    # App and org admins can create v* tags.
    environment: release-staging
    permissions:
      contents: read
    # Seeding, staging and uploading to the BloxBean repository is a read-modify-write of each artifact's version
    # list, so releases of different tags run one at a time. A pending run has uploaded nothing; if GitHub cancels
    # it because a third release queued behind it, run it again.
    concurrency:
      group: bloxbean-maven-releases
      cancel-in-progress: false
    env:
      GROUP_PATH: org/zeroj
      BUCKET: ${{ vars.R2_BUCKET }}
      REPOSITORY_PREFIX: maven/releases
      PUBLIC_REPOSITORY_URL: https://repo.bloxbean.org/maven/releases
      # What the Gradle consumer check resolves, and which of this build's jars it must get.
      CONSUMER_PLATFORM: org.zeroj:zeroj-bom-core
      CONSUMER_DEPENDENCIES: org.zeroj:zeroj-circuit-lib org.zeroj:zeroj-crypto org.zeroj:zeroj-verifier-groth16
      CONSUMER_REQUIRED: zeroj-crypto zeroj-verifier-groth16 zeroj-blst
      # Absolute, because the stagingRepository hook resolves it against each project's own directory.
      STAGING_DIR: ${{ github.workspace }}/build/bloxbean-maven
      AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      # AWS CLI 2.23+ sends request checksums R2 does not accept by default; send them only when an API needs one.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for grgit version
          persist-credentials: false

      - name: Set up Java 25 (GraalVM)
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Download blst natives
        uses: actions/download-artifact@v4
        with:
          pattern: blst-native-*
          merge-multiple: false

      - name: Place native libraries in resource directories
        run: |
          # blst (source-built, replaces the committed dev binaries in the released jars)
          for target in linux/amd64 linux/aarch64 mac/aarch64; do
            os=${target%/*}; arch=${target#*/}
            mkdir -p "zeroj-blst/src/main/resources/native/$target"
            cp "blst-native-$os-$arch"/* "zeroj-blst/src/main/resources/native/$target/" || true
          done

          echo "=== blst native libraries ==="
          find zeroj-blst/src/main/resources/native -type f

      # No Gradle cache here: a cache restored from another run could change what runs next to the
      # signing key and the Central token.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Assert the default graph has no assurance/benchmark/removed-provider edge
        run: ./gradlew verifyDefaultModuleSurface --stacktrace

      # Learns the artifactIds this build owns; unsigned, its staged files are discarded.
      - name: Discover the Maven publications
        id: discover
        if: needs.validate.outputs.bloxbean_repo_publish == 'true'
        run: bash .github/scripts/bloxbean-maven.sh discover -PskipSigning=true

      - name: Seed metadata from the BloxBean repository
        if: needs.validate.outputs.bloxbean_repo_publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash .github/scripts/bloxbean-maven.sh seed

      # The one step that signs, with the subkey passed to Gradle in memory (see configureReleaseSigning in
      # build.gradle): nothing is written to disk and nothing appears on the command line. One Gradle run builds both
      # destinations' files: the staged repository and the Central bundle.
      - name: Stage and sign the Maven publications
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY_ASC }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishAllPublicationsToStagingRepository nmcpZipAggregation
          -PstagingRepository="$STAGING_DIR" --stacktrace

      # Also proves the two destinations get the same release: every file of the Central bundle must be
      # byte-identical to the staged one, and every staged artifact and signature must be in the bundle. A version
      # the BloxBean repository already has is refused: a release is never replaced.
      - name: Verify the staged repository and the Central bundle
        if: needs.validate.outputs.bloxbean_repo_publish == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one argument per artifactId
          python3 .github/scripts/verify-maven-staging.py --central-bundle build/nmcp/zip/aggregation.zip \
            "$STAGING_DIR" "$RUNNER_TEMP/maven-seed" "$GROUP_PATH" "$VERSION" $ARTIFACTS

      # Once the BloxBean repository has this version, a re-run of the tag is refused. If the Central upload then
      # fails, this exact bundle is how Central still gets the same bytes: upload it in the Central Portal.
      - name: Keep the Central bundle
        if: needs.validate.outputs.maven_central_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ needs.validate.outputs.version }}
          path: build/nmcp/zip/aggregation.zip
          retention-days: 90
          if-no-files-found: error

      # Both uploads come before any public check, so a flaky check can never keep the release off Central.
      - name: Upload to the BloxBean repository
        id: bloxbean
        if: needs.validate.outputs.bloxbean_repo_publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash .github/scripts/bloxbean-maven.sh upload

      # Uploads a USER_MANAGED deployment and waits for Sonatype validation. It stops there: nothing
      # is on Maven Central until a human publishes it, via publish-central.yml or the portal. See
      # nmcpAggregation in build.gradle. `-x nmcpZipAggregation` uploads the bundle built and checked above
      # instead of rebuilding it: nothing compiles or signs here.
      - name: Upload deployment to Maven Central staging
        id: upload
        if: needs.validate.outputs.maven_central_publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not add --warn here. It lowers Gradle below LIFECYCLE, which is the level nmcp
          # reports the deployment id at, and the grep below would then fail every release after
          # a successful upload.
          ./gradlew publishAggregationToCentralPortal -x nmcpZipAggregation --stacktrace 2>&1 | tee upload.log
          # The deployment id exists only in nmcp's output. Fail loudly if the log format changes
          # rather than reporting a release with no id.
          id=$(grep -oE "deployment bundle '[0-9a-f-]{36}'" upload.log \
            | head -1 | grep -oE '[0-9a-f-]{36}' || true)
          if [[ -z "$id" ]]; then
            echo "::error::Upload succeeded but no deployment id was found in the log." >&2
            exit 1
          fi
          echo "deployment-id=$id" >> "$GITHUB_OUTPUT"

      # The BloxBean copy is checked even when the Central upload failed: then it is the release's only copy.
      - name: Verify the BloxBean repository
        if: ${{ !cancelled() && steps.bloxbean.outcome == 'success' }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
        run: bash .github/scripts/bloxbean-maven.sh verify-public

      - name: Resolve from the BloxBean repository with a Gradle consumer
        if: ${{ !cancelled() && steps.bloxbean.outcome == 'success' }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACTS: ${{ steps.discover.outputs.artifacts }}
        run: bash .github/scripts/bloxbean-maven.sh consume

      # Reports what actually happened, including on failure, so a partly published release is never mistaken for
      # a complete one.
      - name: Record the release
        if: ${{ !cancelled() }}
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment-id }}
          VERSION: ${{ needs.validate.outputs.version }}
          MAVEN_CENTRAL_PUBLISH: ${{ needs.validate.outputs.maven_central_publish }}
          BLOXBEAN_REPO_PUBLISH: ${{ needs.validate.outputs.bloxbean_repo_publish }}
          BLOXBEAN_OUTCOME: ${{ steps.bloxbean.outcome }}
          GITHUB_RELEASE: ${{ needs.validate.outputs.github_release }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Maven artifacts of \`zeroj:$VERSION\`"
            echo
            if [[ "$BLOXBEAN_REPO_PUBLISH" != true ]]; then
              echo "BloxBean repository: not published (bloxbean_repo_publish=false)."
            elif [[ "$BLOXBEAN_OUTCOME" == success ]]; then
              echo "**BloxBean repository: published** at $PUBLIC_REPOSITORY_URL (public and permanent)."
            else
              echo "**BloxBean repository: NOT published** - the upload failed or did not run."
            fi
            echo
            if [[ "$MAVEN_CENTRAL_PUBLISH" != true ]]; then
              echo "Maven Central: not published (maven_central_publish=false)."
            elif [[ -n "$DEPLOYMENT_ID" ]]; then
              echo "**Maven Central: deployment \`$DEPLOYMENT_ID\` staged - NOT published.** It passed"
              echo "validation and is waiting for a human. Publish it through the approval-gated workflow:"
              echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/publish-central.yml"
              echo
              echo "Or from the portal: https://central.sonatype.com/publishing/deployments"
            else
              echo "**Maven Central: NOT staged** - the upload failed or did not run."
              if [[ "$BLOXBEAN_OUTCOME" == success ]]; then
                echo "The BloxBean repository has this version, so re-running the tag is refused. To put the"
                echo "same bytes on Central, upload this run's \`central-bundle-$VERSION\` artifact at"
                echo "https://central.sonatype.com/publishing (release-ops docs/12)."
              fi
            fi
            echo
            if [[ "$GITHUB_RELEASE" == "true" ]]; then
              echo "The GitHub release job runs next (github_release = true)."
            else
              echo "No GitHub release for this tag (github_release = false)."
              if [[ "$BLOXBEAN_REPO_PUBLISH" != true ]]; then
                echo "If this was a rehearsal, drop any Central deployment in the portal."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # Stage 3: Ceremony CLI distributables
  # (ADR-0031: contributors download one artifact and run the ceremony)
  # ADR-0044: the CLI now ships from zeroj-tools. The command name, CLI
  # behavior and every release asset name are unchanged.
  # Built on every run by ceremony-cli.yml (shared with the snapshot
  # distributions) and kept as workflow artifacts; the github-release
  # job attaches them when github_release is on.
  # ================================================================

  ceremony-cli-release:
    name: ceremony CLI
    needs: [ validate ]
    permissions:
      contents: read
    uses: ./.github/workflows/ceremony-cli.yml

  # ================================================================
  # Stage 4: GitHub release (gated by github_release)
  # ================================================================

  github-release:
    name: GitHub release
    needs: [ validate, publish, ceremony-cli-release ]
    # Gated by github_release in gradle.properties. Runs only after the Central deployment is staged and
    # every platform's CLI is built, and on failure can be re-run on its own without touching Central.
    if: startsWith(github.ref, 'refs/tags/') && needs.validate.outputs.github_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download ceremony CLI distributables
        uses: actions/download-artifact@v4
        with:
          pattern: ceremony-cli-*
          path: dist
          merge-multiple: true

      # Creates the release for the tag, or adds the assets if it already exists. Do not pre-create a
      # draft release for the tag: the action publishes an existing draft.
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.validate.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.validate.outputs.is_final != 'true' }}
          # Latest is decided by semantic version and date, so a maintenance release does not take
          # the Latest badge.
          make_latest: legacy
