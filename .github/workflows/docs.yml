name: Documentation site

# Builds the zeroj.dev docsite (www/) on pull requests that touch it, and publishes it to the
# gh-pages branch from main. Only www/ and gradle.properties trigger it. The versions the pages
# render (ZeroJ, JuLC, CCL) come from www/release.json, which is updated after each release reaches
# Maven Central; check:release verifies them there. The build also reads ZeroJ Java sources (circuit
# API catalog, API-reference check); after changing those, run this workflow manually on main.

on:
  pull_request:
    paths: ['www/**', 'gradle.properties']
  push:
    branches: [main]
    paths: ['www/**', 'gradle.properties']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - name: Check the versions in release.json against Maven Central
        run: npm run check:release
      - name: Type-check pages and verify Java snippets against ZeroJ sources
        run: npm run check
      - name: Build site, AI artifacts and link/checksum verification
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zeroj-docs-site
          path: www/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'bloxbean/zeroj' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Deploys only from refs the release-staging environment allows (main, v*, release/**). The job
    # uses no secrets from that environment, only GITHUB_TOKEN.
    environment: release-staging
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zeroj-docs-site
          path: site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: zeroj.dev
