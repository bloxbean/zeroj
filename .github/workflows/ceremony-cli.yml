name: Ceremony CLI distributables

# Builds the zeroj-ceremony CLI (zeroj-tools, ADR-0031 and ADR-0044) for every supported platform: the fat jar and a
# native zip per platform, uploaded as workflow artifacts ceremony-cli-jar and ceremony-cli-<platform>. Called by
# release.yml, whose github-release job attaches them to the GitHub release, and by bloxbean-snapshot-dist.yml,
# which publishes a snapshot commit's build to https://repo.bloxbean.org/dist/snapshots/zeroj/. Both get the same
# files, built the same way.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ceremony CLI (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux-x86_64
            ext: ''
            fatjar: true          # the (platform-independent) fat jar is uploaded once, from linux
          - runner: ubuntu-24.04-arm
            os: linux-arm64
            ext: ''
            fatjar: false
          - runner: macos-14
            os: macos-arm64
            ext: ''
            fatjar: false
          - runner: windows-latest
            os: windows-x86_64
            ext: '.exe'
            fatjar: false
          # windows-arm64: GraalVM ships no windows-aarch64 native-image toolchain yet —
          # ARM Windows users run the x86_64 binary (emulation) or the fat jar.
          # macos-x86_64 (Intel): GitHub retired the free Intel runner (macos-13) Dec 2025 and
          # macOS = arm64-only across this project — Intel Mac users run the fat jar.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          native-image-job-reports: 'true'

      - name: Build native zip distribution (fatJar -> native-image -> zip)
        shell: bash
        env:
          PLATFORM: ${{ matrix.os }}
          EXT: ${{ matrix.ext }}
        run: |
          ./gradlew :zeroj-tools:nativeDistZip -Pplatform="$PLATFORM" --no-daemon
          "zeroj-tools/build/native/zeroj-ceremony${EXT}" --version

      - name: Upload the native zip
        uses: actions/upload-artifact@v4
        with:
          name: ceremony-cli-${{ matrix.os }}
          path: zeroj-tools/build/distributions/zeroj-ceremony-*-${{ matrix.os }}.zip
          if-no-files-found: error

      # Its own artifact. Uploaded together with the zip, both files would keep their paths below the common
      # parent (libs/, distributions/), and both callers expect every file at the top level: `files: dist/*` in
      # release.yml's github-release job skips directories (0.1.0-pre12 shipped without the fat jar and the
      # linux-x86_64 zip that way), and bloxbean-snapshot-dist.yml checks the exact file set.
      - name: Upload the fat jar
        if: matrix.fatjar
        uses: actions/upload-artifact@v4
        with:
          name: ceremony-cli-jar
          path: zeroj-tools/build/libs/zeroj-ceremony-*-all.jar
          if-no-files-found: error
