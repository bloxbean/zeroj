name: Publish staged deployment to Maven Central

# release.yml uploads a USER_MANAGED deployment and stops once Sonatype has
# validated it. This workflow is the only automated path that makes such a
# deployment public, and it runs only after a reviewer of the `release`
# environment approves. The equivalent manual path is the Central Portal UI.
#
# Publishing cannot be undone: a released version can never be replaced or
# re-uploaded under the same coordinates.

on:
  workflow_dispatch:
    inputs:
      deploymentId:
        description: 'Central Portal deployment id (UUID, from the release run summary)'
        required: true

permissions: {}

# Two approvers acting on two tabs is how the same deployment gets published
# twice. Never cancel a run that may already have called the portal.
concurrency:
  group: publish-central
  cancel-in-progress: false

jobs:
  # Runs before the environment gate so a mistyped id fails immediately instead
  # of paging a reviewer to approve a job that cannot work.
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the deployment id
        env:
          DEPLOYMENT_ID: ${{ inputs.deploymentId }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          if [[ ! "$DEPLOYMENT_ID" =~ $pattern ]]; then
            echo "::error::'$DEPLOYMENT_ID' is not a deployment id." >&2
            echo "::error::Copy the UUID from the release run summary." >&2
            exit 1
          fi

  publish:
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job level, not step level: the approval must fire before anything runs.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # No build, no signing: the artifacts were built, signed and validated by
      # the release run. This only moves the existing deployment to published.
      - name: Publish the deployment
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: >-
          ./gradlew nmcpPublishDeployment
          -PnmcpDeploymentId=${{ inputs.deploymentId }}
          --stacktrace

      - name: Record the publication
        env:
          DEPLOYMENT_ID: ${{ inputs.deploymentId }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Published to Maven Central"
            echo
            echo "Deployment \`$DEPLOYMENT_ID\` was approved by @${{ github.actor }}"
            echo "and moved to publishing."
            echo
            echo "Artifacts appear on Maven Central within a few hours."
          } >> "$GITHUB_STEP_SUMMARY"
