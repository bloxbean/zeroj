name: CI

# ADR-0044: the default build is pure Java. It requires no Go, Rust, Cargo, Node.js, WASM
# toolchain, or RocksDB JNI. The optional assurance (BLS/BBS WASM differential providers) and
# benchmark (MPF/JMT load tools) builds are opt-in and run in `assurance.yml`.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -PskipSigning=true --stacktrace

      - name: Assert the default graph has no assurance/benchmark/removed-provider edge
        run: ./gradlew verifyDefaultModuleSurface --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

  platform-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runner: ubuntu-22.04
          - os: macos-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all tests
        run: ./gradlew test -PskipSigning=true --stacktrace
