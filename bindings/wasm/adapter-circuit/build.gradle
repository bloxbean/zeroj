dependencies {
    implementation project(':adapter-groth16')
    api 'org.zeroj:zeroj-circuit-dsl:0.1.0'
    implementation 'org.zeroj:zeroj-circuit-annotation-api:0.1.0'
    implementation 'org.zeroj:zeroj-circuit-lib:0.1.0'
    implementation 'org.zeroj:zeroj-crypto:0.1.0'
    testAnnotationProcessor 'org.zeroj:zeroj-circuit-annotation-processor:0.1.0'
}
test {
    maxHeapSize = '2g'
    inputs.files(fileTree('build/recipes') { include '*.json' })
    outputs.dir('build/symbolic-test-vectors')
}
tasks.register('fixtures', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.zeroj.bindings.circuit.Fixtures'
    maxHeapSize = '2g'
    args rootProject.file('../js/build/circuit').absolutePath
}

tasks.register('exportRecipe', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.zeroj.bindings.circuit.ExportCircuit'
    maxHeapSize = '2g'
    doFirst {
        if (!project.hasProperty('recipeFile') || !project.hasProperty('artifactDir'))
            throw new GradleException('Set -PrecipeFile and -PartifactDir (relative to bindings/wasm or absolute)')
        args rootProject.file(project.property('recipeFile')).absolutePath,
                rootProject.file(project.property('artifactDir')).absolutePath
    }
}

// Test-only interop after Node and both browsers have exported fresh proofs.
tasks.register('circuitInterop', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.zeroj.bindings.circuit.CircuitInterop'
    maxHeapSize = '2g'
    args rootProject.file('../js/build/circuit').absolutePath
    if (project.hasProperty('circuitJfr')) {
        jvmArgs '-XX:FlightRecorderOptions=stackdepth=128'
        jvmArgs '-XX:StartFlightRecording=settings=profile,filename=' + rootProject.file(project.property('circuitJfr')).absolutePath
    }
}

// Explicit resource experiment; never runs in the normal test/build lane.
tasks.register('largeMerkleBench', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.zeroj.bindings.circuit.LargeMerkleBench'
    def heap = providers.gradleProperty('merkleHeap').getOrElse('6g')
    def depth = providers.gradleProperty('merkleDepth').getOrElse('8')
    if (!(heap in ['6g','8g']) || !(depth in ['8','16','32'])) throw new GradleException('Research heap is 6g/8g, depth is 8/16/32')
    maxHeapSize = heap
    args rootProject.file('../js/build/circuit-large').absolutePath, 'merkle_d'+depth, heap
    if (project.hasProperty('merkleJfr')) jvmArgs '-XX:StartFlightRecording=settings=profile,filename='+rootProject.file(project.property('merkleJfr')).absolutePath
}
tasks.register('merkleWireCensus', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.zeroj.bindings.circuit.MerkleWireCensus'
    maxHeapSize = '2g'
    args rootProject.file('../js/build/circuit-large/wire-census.json').absolutePath
}
tasks.register('largeMerkleInterop', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.zeroj.bindings.circuit.LargeMerkleInterop'
    maxHeapSize = '6g'
    args rootProject.file('../js/build/circuit-large').absolutePath
}
