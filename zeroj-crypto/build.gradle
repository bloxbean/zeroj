plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

description = 'Pure Java optimized cryptographic primitives — Montgomery field arithmetic, EC operations, FFT, MSM'

// ADR-0046 (issue #50): the deterministic (unblinded, r = s = 0) Groth16 prover that the
// byte-equality differential tests need is a test fixture (src/testFixtures), not product code.
// The two test-fixtures variants are removed from the published Java component so neither the
// POM nor the Gradle module metadata of zeroj-crypto can ever carry it; the guard below fails
// metadata generation if a variant with that name reappears, and `check` runs that generation so
// a plain `./gradlew build` catches it, not only the publish job.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

def moduleName = project.name
tasks.withType(GenerateModuleMetadata).configureEach {
    doLast {
        def metadata = outputFile.get().asFile.text
        if (metadata.contains('test-fixtures') || metadata.contains('testFixtures')) {
            throw new GradleException("ADR-0046: ${moduleName} must not publish a test-fixtures variant "
                    + "(the unblinded Groth16 test prover is not product code)")
        }
    }
}
tasks.named('check') { dependsOn tasks.withType(GenerateModuleMetadata) }

test {
    // zeroj-crypto still exercises legacy BN254 arithmetic/prover regression
    // coverage. Runtime users must opt in explicitly to BN254.
    systemProperty 'zeroj.allowLegacyBn254', 'true'
}

// ADR-0027 M7: opt-in prover-scale benchmark. Heavy (minutes, multi-GB); never part of
// the normal `test` run (the Groth16ScaleBenchmark is gated on -Dzeroj.bench=true, which
// only this task sets). Run: ./gradlew :zeroj-crypto:benchmark [-Dzeroj.bench.logs=12,14,16,18,20]
tasks.register('benchmark', Test) {
    description = 'ADR-0027 M7 pure-Java Groth16 prover-scale benchmark (opt-in, heavy).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = project.findProperty('benchHeap') ?: '10g'
    systemProperty 'zeroj.bench', 'true'
    systemProperty 'zeroj.allowInsecureTrustedSetup', 'true'
    systemProperty 'zeroj.allowLegacyBn254', 'true'
    if (System.getProperty('zeroj.bench.logs') != null) {
        systemProperty 'zeroj.bench.logs', System.getProperty('zeroj.bench.logs')
    }
    filter { includeTestsMatching 'com.bloxbean.cardano.zeroj.crypto.groth16.Groth16ScaleBenchmark' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

dependencies {
    api project(':zeroj-api')
    api project(':zeroj-bls12381')

    // Test-only: integration test uses the circuit DSL, codec, and verifier to close the loop
    testImplementation project(':zeroj-circuit-dsl')
    testImplementation project(':zeroj-verifier-groth16')
    testImplementation project(':zeroj-codec')
    // ADR-0047: snarkjs export KATs pin the exporter byte-for-byte against the shared snarkjs vectors
    testImplementation project(':zeroj-test-vectors')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'ZeroJ Crypto'
                description = 'Pure Java optimized field arithmetic and elliptic curve operations for ZK proving'
            }
        }
    }
}
