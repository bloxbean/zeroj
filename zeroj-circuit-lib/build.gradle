plugins {
    id 'java-library'
}

description = 'ZeroJ Circuit Library — reusable ZK circuit components (Poseidon, Merkle, comparators)'

test {
    // Non-native-field / hash gadgets build large constraint graphs (a single Ed25519 field
    // inverse is ~3M constraints); give the test JVM headroom so heavy gadget tests don't OOM.
    maxHeapSize = '4g'
}

// ADR-0038 P4 benchmark matrix. Deliberately NOT a gate: nothing here asserts, because a
// timing assertion in CI is flaky and a harness that finds no leak proves nothing. The
// deterministic add/double operation-count gate in SecretScalarScheduleTest is what CI
// enforces. Run: ./gradlew :zeroj-circuit-lib:secretScalarBenchmark
tasks.register('secretScalarBenchmark', Test) {
    description = 'ADR-0038 P4 secret-scalar timing benchmark matrix (records, does not assert).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*SecretScalarTimingBenchmark*' }
    systemProperty 'zeroj.bench', 'true'
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

// ADR-0039 M6 fixed-limb signer/Pedersen performance matrix. Results are evidence for the
// exact JVM/CPU used to run it, never a portable constant-time or readiness claim.
// Run: ./gradlew :zeroj-circuit-lib:jubjubHardenedBenchmark
tasks.register('jubjubHardenedBenchmark', Test) {
    description = 'ADR-0039 M6 hardened Jubjub latency/allocation/concurrency benchmark.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*HardenedJubjubBenchmark*' }
    systemProperty 'zeroj.hardenedBench', 'true'
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

// Diagnostic timing harness with a deliberately leaky negative control. It records Welch
// statistics; only failure to detect the negative control is asserted.
// Run: ./gradlew :zeroj-circuit-lib:jubjubHardenedTiming
tasks.register('jubjubHardenedTiming', Test) {
    description = 'ADR-0039 M6 diagnostic fixed-limb timing/Welch harness.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*HardenedJubjubTimingHarness*' }
    systemProperty 'zeroj.hardenedTiming', 'true'
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('jubjubHardenedTimingInterpreted', Test) {
    description = 'ADR-0039 M6 timing harness under the interpreter (-Xint).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*HardenedJubjubTimingHarness*' }
    systemProperty 'zeroj.hardenedTiming', 'true'
    systemProperty 'zeroj.hardenedTimingWarmup', '100'
    systemProperty 'zeroj.hardenedTimingSamples', '600'
    jvmArgs '-Xint'
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('jubjubHardenedTimingC1', Test) {
    description = 'ADR-0039 M6 timing harness with C1-only compilation.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*HardenedJubjubTimingHarness*' }
    systemProperty 'zeroj.hardenedTiming', 'true'
    systemProperty 'zeroj.hardenedTimingWarmup', '1000'
    systemProperty 'zeroj.hardenedTimingSamples', '6000'
    jvmArgs '-XX:TieredStopAtLevel=1'
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('jubjubHardenedTimingC2', Test) {
    description = 'ADR-0039 M6 timing harness with tiering disabled and C2 batch compilation.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*HardenedJubjubTimingHarness*' }
    systemProperty 'zeroj.hardenedTiming', 'true'
    systemProperty 'zeroj.hardenedTimingWarmup', '2000'
    systemProperty 'zeroj.hardenedTimingSamples', '12000'
    jvmArgs '-XX:-TieredCompilation', '-Xbatch'
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

// Opt-in heavy gadget tests (full Ed25519 scalar-mult circuits, ~30M+ constraints). Gated on
// -Dzeroj.heavy=true so the normal test run stays fast. Run: ./gradlew :zeroj-circuit-lib:heavyGadgetTest
tasks.register('heavyGadgetTest', Test) {
    description = 'ADR-0027 heavy gadget tests (full in-circuit Ed25519 scalar mult).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = '48g'
    systemProperty 'zeroj.heavy', 'true'
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

dependencies {
    api project(':zeroj-circuit-dsl')
    api project(':zeroj-circuit-annotation-api')

    testImplementation project(':zeroj-test-vectors')
    // Test-only oracle for the Blake2b gadget: cardano-client's Blake2bUtil is exactly the
    // implementation Cardano uses for key hashes, so cross-checking against it proves
    // Cardano-compatibility of blake2b-224 / -256 directly. Not a compile/runtime dependency.
    testImplementation 'com.bloxbean.cardano:cardano-client-crypto:0.8.0-pre4'
    // Authoritative RFC 8032 Ed25519 oracle for the Ed25519 gadget tests.
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.83'
}

/**
 * Regenerates the committed Poseidon parameter source files
 * (PoseidonParamsBN254T3.java, PoseidonParamsBLS12_381T3.java) from the
 * Grain LFSR reference implementation in PoseidonGrainLFSR. Output is
 * written directly into src/main/java so the constants are version-controlled
 * and reviewable.
 *
 * Usage: ./gradlew :zeroj-circuit-lib:generatePoseidonParams
 *
 * See docs/adr/0015-bls12-381-poseidon-constants.md for the rationale.
 */
tasks.register('generatePoseidonParams', JavaExec) {
    group = 'codegen'
    description = 'Regenerate Poseidon parameter presets from the Grain LFSR.'
    mainClass = 'com.bloxbean.cardano.zeroj.circuit.lib.poseidon.PoseidonParamsCodegen'
    classpath = sourceSets.main.runtimeClasspath
    args projectDir.absolutePath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'ZeroJ Circuit Library'
                description = 'Standard library of reusable ZK circuit components for the ZeroJ circuit DSL'
            }
        }
    }
}
