plugins {
    id 'java-platform'
    id 'maven-publish'
    // The root `subprojects` block returns early for BOM projects, so it never reaches this one;
    // without this apply the BOM would drop out of the Central deployment.
    id 'com.gradleup.nmcp'
    id 'signing'
}

description = 'ZeroJ Core Bill of Materials — the single stable BOM for the default ZeroJ product surface'

javaPlatform {
    allowDependencies()
}

dependencies {
    constraints {
        // ADR-0044 Decision 1: the single stable BOM constrains only the default product surface.
        // Explicit opt-in product artifacts (zeroj-verifier-plonk, zeroj-bbs, zeroj-mpf-poseidon,
        // zeroj-jmt-poseidon) are declared by coordinate and version by the application until their
        // support classification warrants inclusion here.
        api project(':zeroj-api')
        api project(':zeroj-codec')
        api project(':zeroj-backend-spi')
        api project(':zeroj-verifier-groth16')
        api project(':zeroj-bls12381')
        api project(':zeroj-blst')
        api project(':zeroj-crypto')
        api project(':zeroj-crypto-blst')
        api project(':zeroj-circuit-dsl')
        api project(':zeroj-circuit-lib')
        api project(':zeroj-circuit-annotation-api')
        api project(':zeroj-circuit-annotation-processor')
        api project(':zeroj-onchain-julc')
        api project(':zeroj-tools')
    }
}

publishing {
    publications {
        bom(MavenPublication) {
            from components.javaPlatform
            pom {
                name = 'ZeroJ Core BOM'
                description = 'Bill of Materials for the default ZeroJ product surface (ADR-0044). Opt-in product artifacts are declared explicitly by the application.'
                url = 'https://github.com/bloxbean/zeroj'
                licenses {
                    license {
                        name = 'The MIT License'
                        url = 'https://opensource.org/licenses/mit-license.php'
                    }
                }
                developers {
                    developer {
                        id = 'satran004'
                        name = 'Satya'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/bloxbean/zeroj.git'
                    developerConnection = 'scm:git:ssh://git@github.com/bloxbean/zeroj.git'
                    url = 'https://github.com/bloxbean/zeroj'
                }
            }
        }
    }
}

ext.isReleaseVersion = !version.endsWith("SNAPSHOT")
if (isReleaseVersion && !project.hasProperty("skipSigning")) {
    signing {
        sign publishing.publications
    }
}
