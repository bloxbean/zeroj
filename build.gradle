plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'org.ajoberstar.grgit' version '5.2.0'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url = uri("https://central.sonatype.com/repository/maven-snapshots")
            content {
                snapshotsOnly()
            }
        }
    }
}

ext.ossrhUsername = System.getenv('MAVEN_USERNAME')
ext.ossrhPassword = System.getenv('MAVEN_PASSWORD')
ext.cclVersion = '0.8.0-pre5'

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username = ossrhUsername
            password = ossrhPassword
        }
    }
}

subprojects {
    def commit_id = getCheckedOutGitCommitHash()
    if (project.version.endsWith("-SNAPSHOT")) {
        version = "${project.version}".replace("-SNAPSHOT", "-${commit_id}-SNAPSHOT")
    }

    // BOM modules use java-platform, which is incompatible with java-library
    if (project.name.startsWith('zeroj-bom')) {
        return
    }

    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        systemProperty 'zeroj.allowInsecureTrustedSetup', 'true'
        maxHeapSize = '1g'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('-release', '25')
        options.addStringOption('Xdoclint:none', '-quiet')
        failOnError = false
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.bloxbean.cardano'
                    && details.requested.name.startsWith('cardano-client-')) {
                details.useVersion(rootProject.ext.cclVersion)
                details.because('ADR-0042 pins every Cardano Client Lib artifact to one verified pre5 baseline')
            }
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = true
        }
    }

    // Publishing for publishable modules. ADR-0044: the assurance (WASM differential providers),
    // benchmark (MPF/JMT load tools), and integration-test projects are never published, even when
    // their opt-in settings flag puts them in the build.
    def nonPublishable = ['zeroj-test-vectors', 'zeroj-integration-tests',
                          'zeroj-mpf-poseidon-load', 'zeroj-jmt-poseidon-load',
                          'zeroj-bls12381-wasm', 'zeroj-bbs-wasm']
    if (!nonPublishable.contains(project.name)) {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        afterEvaluate {
            publishing {
                repositories {
                    maven {
                        def releasesRepoUrl = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
                        def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"
                        url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                        credentials {
                            username rootProject.ext.ossrhUsername
                            password rootProject.ext.ossrhPassword
                        }
                    }
                }
                publications {
                    mavenJava(MavenPublication) {
                        from components.java
                        artifactId project.name
                        pom {
                            url = 'https://github.com/bloxbean/zeroj'
                            licenses {
                                license {
                                    name = 'The MIT License'
                                    url = 'https://opensource.org/licenses/mit-license.php'
                                }
                            }
                            developers {
                                developer {
                                    id = 'satran004'
                                    name = 'Satya'
                                }
                            }
                            scm {
                                connection = 'scm:git:git://github.com/bloxbean/zeroj.git'
                                developerConnection = 'scm:git:ssh://git@github.com/bloxbean/zeroj.git'
                                url = 'https://github.com/bloxbean/zeroj'
                            }
                        }
                    }
                }
            }
        }

        ext.isReleaseVersion = !version.endsWith("SNAPSHOT")
        if (isReleaseVersion && !project.hasProperty("skipSigning")) {
            signing {
                sign publishing.publications
            }
        }
    }
}

// === ADR-0044 structural guard =================================================================
// Asserts that the default (stable) product graph never gains an edge to an assurance, benchmark,
// incubator, or removed module, and that the boundaries the ADR keeps apart stay apart. Runs in CI,
// snapshot, and release so optional code cannot silently return to the published surface.
tasks.register('verifyDefaultModuleSurface') {
    group = 'verification'
    description = 'ADR-0044: assert the default module graph has no assurance/benchmark/removed edge.'

    def forbiddenNames = [
            // removed by ADR-0044 Decision 3
            'zeroj-prover-gnark', 'zeroj-prover-spi', 'zeroj-verifier-halo2', 'zeroj-prover-wasm',
            'zeroj-cardano', 'zeroj-ccl', 'zeroj-patterns', 'zeroj-examples', 'zeroj-bom-all',
            // merged away by ADR-0044 Decision 5
            'zeroj-verifier-core', 'zeroj-ceremony',
            // kept, but outside the default build (Decision 4)
            'zeroj-bls12381-wasm', 'zeroj-bbs-wasm',
            'zeroj-mpf-poseidon-load', 'zeroj-jmt-poseidon-load',
    ]
    // Modules that are themselves outside the stable surface: they may depend on each other, but
    // nothing stable may depend on them.
    def nonStableNames = [
            'zeroj-integration-tests',
            'zeroj-bls12381-wasm', 'zeroj-bbs-wasm',
            'zeroj-mpf-poseidon-load', 'zeroj-jmt-poseidon-load',
    ]

    // Two views. `graph` is every declared project edge (runtime + test); `runtimeGraph` is only
    // what ends up in the published POM. A test-only edge to an optional provider is legitimate
    // assurance wiring; a runtime edge to one is a product-surface leak.
    def edgesOf = { sub, Closure filter ->
        sub.configurations.findAll { filter(it.name) }
                .collectMany { cfg -> cfg.dependencies.withType(ProjectDependency).collect { it.name } }
                .toUnique()
    }
    def graph = rootProject.subprojects.collectEntries {
        [(it.name): edgesOf(it) { true }]
    }
    def runtimeGraph = rootProject.subprojects.collectEntries {
        [(it.name): edgesOf(it) { n -> n in ['api', 'implementation', 'compileOnly', 'runtimeOnly'] }]
    }
    def presentNames = rootProject.subprojects.collect { it.name }

    // ADR-0046: test fixtures (the unblinded Groth16 test prover) are consumed by test
    // configurations only. A runtime edge would carry the fixture capability into a published
    // POM/module file, so it is a product-surface leak like any other.
    def requestsTestFixtures = { dep ->
        def selectors = dep.hasProperty('capabilitySelectors') ? dep.capabilitySelectors : dep.requestedCapabilities
        selectors.any { sel ->
            (sel.hasProperty('featureName') && sel.featureName == 'test-fixtures')
                    || (sel.hasProperty('name') && sel.name.endsWith('-test-fixtures'))
        }
    }
    def fixtureRuntimeEdges = rootProject.subprojects.collectMany { sub ->
        sub.configurations
                .findAll { it.name in ['api', 'implementation', 'compileOnly', 'runtimeOnly'] }
                .collectMany { cfg ->
                    cfg.dependencies.withType(ProjectDependency)
                            .findAll { requestsTestFixtures(it) }
                            .collect { "${sub.name} -> ${it.name} test fixtures via '${cfg.name}'" }
                }
    }

    doLast {
        def failures = []

        runtimeGraph.each { name, deps ->
            if (nonStableNames.contains(name)) return
            deps.findAll { forbiddenNames.contains(it) }.each {
                failures << "stable module '${name}' has a runtime dependency on out-of-surface module '${it}'"
            }
        }

        presentNames.findAll { forbiddenNames.contains(it) && !nonStableNames.contains(it) }.each {
            failures << "removed/merged project '${it}' is still in the default settings.gradle"
        }

        // Boundaries ADR-0042 and ADR-0044 require to stay separate.
        if (graph['zeroj-mpf-poseidon']?.contains('zeroj-jmt-poseidon')
                || graph['zeroj-jmt-poseidon']?.contains('zeroj-mpf-poseidon')) {
            failures << 'zeroj-mpf-poseidon and zeroj-jmt-poseidon must remain independent (ADR-0042)'
        }
        if (graph['zeroj-circuit-annotation-api']?.contains('zeroj-circuit-annotation-processor')) {
            failures << 'the annotation API must not depend on the annotation processor'
        }

        // Pure-Java modules must not acquire a native or WASM dependency.
        def nativeNames = ['zeroj-blst', 'zeroj-crypto-blst', 'zeroj-bls12381-wasm', 'zeroj-bbs-wasm']
        def pureJavaNames = ['zeroj-api', 'zeroj-codec', 'zeroj-backend-spi', 'zeroj-bls12381',
                             'zeroj-crypto', 'zeroj-circuit-dsl', 'zeroj-circuit-lib',
                             'zeroj-circuit-annotation-api', 'zeroj-circuit-annotation-processor',
                             'zeroj-verifier-plonk', 'zeroj-bbs', 'zeroj-mpf-poseidon',
                             'zeroj-jmt-poseidon', 'zeroj-tools']
        pureJavaNames.each { name ->
            runtimeGraph[name]?.findAll { nativeNames.contains(it) }?.each {
                failures << "pure-Java module '${name}' gained native/WASM dependency '${it}'"
            }
        }

        fixtureRuntimeEdges.each {
            failures << "ADR-0046: ${it} (test fixtures are never product code)"
        }

        if (!failures.isEmpty()) {
            throw new GradleException("ADR-0044 module-surface check failed:\n  - "
                    + failures.join("\n  - "))
        }
        logger.lifecycle("ADR-0044 module-surface check passed (${presentNames.size()} default projects).")
    }
}

// ADR-0046: the guard is part of the local verification lifecycle, not only a separate CI step,
// so `./gradlew build` (root `check`) fails on a test-fixtures runtime edge or a removed module edge.
tasks.named('check') { dependsOn 'verifyDefaultModuleSurface' }

def getCheckedOutGitCommitHash() {
    try {
        grgit.head().abbreviatedId
    } catch (Exception e) {
        'git rev-parse --short HEAD'.execute(null, project.rootDir).text.trim()
    }
}
