plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

description = 'ZeroJ shared pure Java BLS12-381 primitives'

dependencies {
    // ADR-0060 D7: the G1 Pedersen profiles implement the zeroj-api commitment contract.
    api project(':zeroj-api')

    // ADR-0060 M3: the commitment-profiles-v1 §13 vector runner is a test fixture, shared with the
    // blst provider's tests (zeroj-blst) so both providers run the same cases with the same code.
    testFixturesApi 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testFixturesImplementation project(':zeroj-test-vectors')
    testImplementation project(':zeroj-test-vectors')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

// ADR-0060 M3 (following ADR-0046 in zeroj-crypto): the vector runner in src/testFixtures is test
// code, not product code. Both test-fixtures variants are removed from the published Java component,
// and metadata generation fails if one reappears; `check` runs that generation so a plain
// `./gradlew build` catches it, not only the publish job.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

def moduleName = project.name
tasks.withType(GenerateModuleMetadata).configureEach {
    doLast {
        def metadata = outputFile.get().asFile.text
        if (metadata.contains('test-fixtures') || metadata.contains('testFixtures')) {
            throw new GradleException("ADR-0060 M3: ${moduleName} must not publish a test-fixtures variant "
                    + "(the G1 commitment vector runner is not product code)")
        }
    }
}
tasks.named('check') { dependsOn tasks.withType(GenerateModuleMetadata) }

// ADR-0060 M5 / commitment-profiles-v1 §15: standalone G1 Pedersen benchmark harness. Records
// numbers, asserts nothing; it launches its own JVM forks. Run: ./gradlew :zeroj-bls12381:g1PedersenBenchmark
tasks.register('g1PedersenBenchmark', JavaExec) {
    group = 'verification'
    description = 'ADR-0060: G1 Pedersen host benchmark (records only).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.zeroj.bls12381.pedersen.G1PedersenBenchmark'
}

// ADR-0061 M2: BulletproofVectorsTest checks the vector file's spec provenance hashes against the
// spec files, so a spec edit without a regenerated vector file fails the build.
tasks.named('test') {
    systemProperty 'zeroj.repo.root', rootProject.projectDir.absolutePath
    inputs.files(rootProject.files('docs/specs/bulletproof-range-bls12-381-g1-v1.md',
            'docs/specs/pedersen-bls12-381-g1-v1.md', 'docs/specs/commitment-profiles-v1.md')).withPropertyName('specs')
}

// ADR-0061 M3 / commitment-profiles-v1 §15: standalone Bulletproof range-proof benchmark (records only;
// launches its own JVM forks). The harness is a test fixture so that zeroj-blst can run it against
// the blst provider. Run: ./gradlew :zeroj-bls12381:bulletproofBenchmark
tasks.register('bulletproofBenchmark', JavaExec) {
    group = 'verification'
    description = 'ADR-0061: Bulletproof range-proof host benchmark, pure-Java provider (records only).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.zeroj.bls12381.bulletproofs.BulletproofBenchmark'
    args '--provider', 'pure'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'ZeroJ BLS12-381'
                description = 'Shared pure Java BLS12-381 field, curve, pairing, and provider primitives'
            }
        }
    }
}
